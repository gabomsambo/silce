# no-mistakes pipeline agent preference order.
#
# This list is not per-step: the first available entry becomes the primary agent
# for the whole run, so order is the only dial here.
#
# cursor leads as of 2026-10-11. Codex quota was the tightest subscription
# window, so it no longer runs first; cursor's model is pinned in the
# machine-wide ~/.no-mistakes/config.yaml agent_config. opencode then codex
# then claude are fallbacks.
# The runner falls through to the next agent when one is unavailable, declines,
# or fails at runtime.
#
# On 2026-09-06 the owner had made codex first by preference; that standing
# order held until the 2026-10-11 reorder above.

agent: [cursor, opencode, codex, claude]
