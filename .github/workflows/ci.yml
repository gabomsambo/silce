name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, lint, build, link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Read the version from .nvmrc so CI and the Cloudflare Pages build agree
      # on one Node version, and so a version .nvmrc cannot resolve fails here
      # first instead of silently falling back to the Pages image default.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Keep --ignore-scripts: the Next build needs no postinstall step, and some
      # remaining install scripts download binaries. See the "Install with
      # `npm ci --ignore-scripts`" sharp edge in AGENTS.md for the full rationale.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

      # The check that pays for itself here: crawls the built output in a real
      # `next start` server and fails on internal 404s or dropped locale prefixes.
      - name: Link integrity
        run: npm run check:links

      # The link crawl skips asset hrefs, so it cannot see a declared icon that
      # no static file backs. This checks the icon/manifest half of that bug class.
      - name: Icon integrity
        run: npm run check:icons
