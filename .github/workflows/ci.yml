name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: typecheck, lint, build, link integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Keep --ignore-scripts. The Next build needs no postinstall step, and the
      # remaining install scripts (workerd, esbuild) download binaries. The
      # original blocker — an rclone.js postinstall whose host timed out — is gone
      # as of next 15.5.25 / @opennextjs/cloudflare 1.19.11, but dropping the flag
      # is still a behaviour change that needs its own verification.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

      # The check that pays for itself here: crawls the built output in a real
      # `next start` server and fails on internal 404s or dropped locale prefixes.
      - name: Link integrity
        run: npm run check:links
