name: Preview smoke

# Cloudflare Pages reports a deploy as successful once its files are uploaded; it
# never sends a request. The Next 16 upgrade (#44) passed every check and then served
# HTTP 500 on every page in production; its fix (#45) then answered 503 "error code:
# 1102" (Worker over its CPU limit) on 10-50% of requests, which a single pass cannot
# see. This job waits for the PR's real Cloudflare Pages preview deployment, requests
# every page, then runs a sustained 600-request test that fails on ANY non-200.
#
# Make this check required in the branch protection rules so a merge cannot
# outrun it: merging to main deploys straight to production.

on:
  pull_request:

permissions:
  contents: read
  checks: read

concurrency:
  group: preview-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Cloudflare preview serves pages
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The "Cloudflare Pages" check run is created by Cloudflare's GitHub app for
      # the PR head commit; once completed its summary carries the preview URL.
      - name: Wait for the Cloudflare Pages preview
        id: preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 56); do
            run=$(gh api "repos/$REPO/commits/$SHA/check-runs?check_name=Cloudflare%20Pages" \
              --jq '.check_runs[0] // empty')
            status=$(jq -r '.status // empty' <<<"$run")
            conclusion=$(jq -r '.conclusion // empty' <<<"$run")
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::Cloudflare Pages build finished with conclusion '$conclusion'"
                exit 1
              fi
              url=$(jq -r '.output.summary // ""' <<<"$run" \
                | grep -oE "href='https://[^']+'" | head -1 | sed -E "s/href='(.*)'/\1/")
              if [ -z "$url" ]; then
                echo "::error::Cloudflare Pages check succeeded but no preview URL was found in its summary"
                exit 1
              fi
              echo "Preview URL: $url"
              echo "url=$url" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "attempt $attempt: Cloudflare Pages check is '${status:-not created yet}', waiting"
            sleep 30
          done
          echo "::error::Timed out waiting for the Cloudflare Pages preview"
          exit 1

      - name: Smoke and sustained-load check the preview
        run: node scripts/check-preview.mjs "${{ steps.preview.outputs.url }}" --requests 600 --concurrency 6
